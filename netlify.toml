[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# Set these in the Netlify dashboard (Site settings → Environment variables):
# RESEND_API_KEY            — from https://resend.com/api-keys
# RESEND_FROM_EMAIL         — e.g. Perfect Love Wedding <onboarding@resend.dev> or your verified domain
# SUPABASE_URL              — from Supabase project settings
# SUPABASE_SERVICE_ROLE_KEY — service role key (server only)
# ADMIN_USERNAME            — admin login username
# ADMIN_PASSWORD            — admin login password
# ADMIN_SESSION_SECRET      — long random string for signed admin sessions
# NEXT_PUBLIC_SITE_URL      — only if using a custom domain (Netlify sets URL automatically otherwise)
